apiVersion: v1
kind: Pod
metadata:
  name: alert-demo
  namespace: monitoring-lab
  labels:
    app: alert-demo
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  containers:
    - name: pending-demo
      image: python:3.13-slim-bookworm
      command: [python, -c, "import time; time.sleep(600)"]
      resources:
        requests:
          cpu: "100"
          memory: 32Mi
        limits:
          cpu: "100"
          memory: 64Mi
