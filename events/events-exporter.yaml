apiVersion: v1
kind: ServiceAccount
metadata:
  name: events-exporter
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: monitoring-events-exporter
rules:
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: monitoring-events-exporter
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: monitoring-events-exporter
subjects:
  - kind: ServiceAccount
    name: events-exporter
    namespace: monitoring
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: events-exporter
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: events-exporter
  template:
    metadata:
      labels:
        app: events-exporter
    spec:
      serviceAccountName: events-exporter
      containers:
        - name: events-exporter
          image: facetscloud/event-exporter:18
          imagePullPolicy: IfNotPresent
          args:
            - --eventType=Warning
            - --eventType=Normal
            - --port=9102
          ports:
            - name: metrics
              containerPort: 9102
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: events-exporter
  namespace: monitoring
  labels:
    app: events-exporter
spec:
  selector:
    app: events-exporter
  ports:
    - name: metrics
      port: 9102
      targetPort: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: events-exporter
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - monitoring
  selector:
    matchLabels:
      app: events-exporter
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
