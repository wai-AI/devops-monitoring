apiVersion: apps/v1
kind: Deployment
metadata:
  name: logging-demo
  namespace: logging-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logging-demo
  template:
    metadata:
      labels:
        app: logging-demo
    spec:
      automountServiceAccountToken: false
      containers:
        - name: app
          image: python:3.13-slim-bookworm
          imagePullPolicy: IfNotPresent
          command: ["python", "-u", "/app/app.py"]
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: code
              mountPath: /app
              readOnly: true
      volumes:
        - name: code
          configMap:
            name: logging-demo-app
---
apiVersion: v1
kind: Service
metadata:
  name: logging-demo
  namespace: logging-lab
spec:
  selector:
    app: logging-demo
  ports:
    - name: http
      port: 80
      targetPort: http
